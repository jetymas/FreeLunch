services:
  freelunch-data-migration:
    build: .
    user: "0:0"
    command: ["/usr/local/bin/migrate-data-ownership"]
    environment:
      FREELUNCH_ALLOW_DATA_CHOWN: ${FREELUNCH_ALLOW_DATA_CHOWN:-0}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/app/data
  freelunch:
    build: .
    user: "10001:10001"
    depends_on:
      freelunch-data-migration:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
